name: Testes .NET

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Executar testes
        shell: bash
        run: |
          dotnet test --verbosity normal | tee resultado-testes.log
          echo "::notice title=Resultado dos testes::$(grep -E '^ *(Passed|Failed) |Total tests|Test Run (Successful|Failed)' resultado-testes.log | sed 's/^ *//' | tr '\n' '|')"
